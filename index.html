<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>minecraft 2d yay</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
        }
        canvas {
            background-color: #74b9ff; /* Smooth sky blue */
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #ui {
            position: absolute;
            top: 20px;
            color: white;
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>

    <div id="ui">
        Controls: <b>A / D</b> — Move | <b>W / Space</b> — Jump | <b>Left Click</b> — Break Blocks<br>
        <span id="inventory">Wood in Inventory: 0</span>
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const invText = document.getElementById("inventory");

// World Settings
const BLOCK_SIZE = 40;
const GRAVITY = 0.5;

// Block and Character Colors (Completely flat colors, no pixels)
const COLORS = {
    sky: "#74b9ff",
    grass: "#2ecc71",
    dirt: "#875A36",
    stone: "#7f8c8d",
    wood: "#bdc581",
    leaves: "#26de81",
    steveShirt: "#00cec9",
    stevePants: "#0984e3",
    steveSkin: "#ffdead"
};

// Player State (Steve)
const player = {
    x: 100,
    y: 200,
    width: 24,
    height: 56,
    vx: 0,
    vy: 0,
    speed: 4,
    jumpForce: 10,
    grounded: false,
    inventory: { wood: 0 }
};

// World Grid Setup
const world = [];
const cols = canvas.width / BLOCK_SIZE;
const rows = canvas.height / BLOCK_SIZE;
const groundLevel = 10; // The layer where grass starts

function initWorld() {
    for (let x = 0; x < cols; x++) {
        world[x] = [];
        for (let y = 0; y < rows; y++) {
            let blockType = null; // Air

            if (y === groundLevel) {
                blockType = 'grass';
            } else if (y > groundLevel && y < groundLevel + 3) {
                blockType = 'dirt';
            } else if (y >= groundLevel + 3) {
                blockType = 'stone';
            }
            
            world[x][y] = blockType;
        }
    }

    // Grow one smooth, flat tree in the center
    const treeX = Math.floor(cols / 2);
    world[treeX][groundLevel - 1] = 'wood';
    world[treeX][groundLevel - 2] = 'wood';
    world[treeX][groundLevel - 3] = 'wood';
    
    // Foliage around the top of the tree
    world[treeX][groundLevel - 4] = 'leaves';
    world[treeX - 1][groundLevel - 3] = 'leaves';
    world[treeX + 1][groundLevel - 3] = 'leaves';
    world[treeX - 1][groundLevel - 4] = 'leaves';
    world[treeX + 1][groundLevel - 4] = 'leaves';
}

// Keyboard Input Handler
const keys = {};
window.addEventListener("keydown", e => keys[e.code] = true);
window.addEventListener("keyup", e => keys[e.code] = false);

// Mouse Click to Break Blocks
canvas.addEventListener("mousedown", e => {
    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    const blockX = Math.floor(mouseX / BLOCK_SIZE);
    const blockY = Math.floor(mouseY / BLOCK_SIZE);

    if (world[blockX] && world[blockX][blockY]) {
        const type = world[blockX][blockY];
        if (type !== 'stone') { // Let's keep stone unbreakable for bedrock feel
            if (type === 'wood') {
                player.inventory.wood++;
                invText.innerText = `Wood in Inventory: ${player.inventory.wood}`;
            }
            world[blockX][blockY] = null; // Turn into air
        }
    }
});

// Collision Detection against solid blocks
function checkCollision(x, y) {
    const left = Math.floor(x / BLOCK_SIZE);
    const right = Math.floor((x + player.width) / BLOCK_SIZE);
    const top = Math.floor(y / BLOCK_SIZE);
    const bottom = Math.floor((y + player.height) / BLOCK_SIZE);

    for (let bx = left; bx <= right; bx++) {
        for (let by = top; by <= bottom; by++) {
            if (world[bx] && world[bx][by]) {
                return true; // Collision detected
            }
        }
    }
    return false;
}

// Update Physics and Movement
function update() {
    // Horizontal movement
    player.vx = 0;
    if (keys["KeyA"] || keys["ArrowLeft"]) player.vx = -player.speed;
    if (keys["KeyD"] || keys["ArrowRight"]) player.vx = player.speed;

    // Apply horizontal speed and check for wall collisions
    player.x += player.vx;
    if (checkCollision(player.x, player.y)) {
        player.x -= player.vx; // Revert movement on collision
    }

    // Gravity and Vertical movement
    player.vy += GRAVITY;
    player.y += player.vy;
    player.grounded = false;

    if (checkCollision(player.x, player.y)) {
        player.y -= player.vy; // Revert vertical movement
        if (player.vy > 0) {
            player.grounded = true; // Steve is standing on a solid block
        }
        player.vy = 0;
    }

    // Jumping
    if ((keys["KeyW"] || keys["Space"]) && player.grounded) {
        player.vy = -player.jumpForce;
        player.grounded = false;
    }

    // Keep Steve inside screen boundaries
    if (player.x < 0) player.x = 0;
    if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
}

// Render Steve and the flat world
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. Draw the seamless block grid
    for (let x = 0; x < cols; x++) {
        for (let y = 0; y < rows; y++) {
            const block = world[x][y];
            if (block) {
                ctx.fillStyle = COLORS[block];
                // Draw blocks flush against each other without borders
                ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
            }
        }
    }

    // 2. Draw Steve (Flat, vector style)
    ctx.fillStyle = COLORS.stevePants; // Pants / Legs
    ctx.fillRect(player.x, player.y + 32, player.width, 24);

    ctx.fillStyle = COLORS.steveShirt; // Shirt / Torso
    ctx.fillRect(player.x, player.y + 16, player.width, 16);

    ctx.fillStyle = COLORS.steveSkin;  // Head / Face
    ctx.fillRect(player.x + 2, player.y, player.width - 4, 16);
}

// Main Game Loop
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// Start Game
initWorld();
gameLoop();
</script>

</body>
</html>
